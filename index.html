<script>
'use strict';
/* ===================== CORE ===================== */
const W=192,H=340;
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');cv.width=W;cv.height=H;
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let SPEED=1;
const sleep=ms=>{const m=M;return new Promise((r,j)=>setTimeout(()=>{if(m&&(m.abandon||M!==m))j('abort');else r()},ms*SPEED))};
const now=()=>performance.now();
let G=cx;
function R(x,y,w,h,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),w,h)}
function fit(){const a=$('#app').getBoundingClientRect();const cs=getComputedStyle($('#app'));
  const w=a.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=a.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let s=Math.min(w/W,h/H);const st=$('#stage');st.style.width=W*s+'px';st.style.height=H*s+'px';st.style.setProperty('--u',s+'px')}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

/* ===================== PIXEL FONT ===================== */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','!':'010010010000010','?':'110001010000010',"'":'010010000000000','.':'000000000000010','-':'000000111000000','/':'001001010100100',':':'000010000010000','+':'000010111010000',',':'000000000010100','x':'000101010101000','*':'101010101000000'};
function tw(s,sc=1){return String(s).length*4*sc-sc}
function txt(s,x,y,c,sc=1,al){s=String(s);const w=tw(s,sc);if(al==='c')x-=Math.floor(w/2);else if(al==='r')x-=w;G.fillStyle=c;
  for(let i=0;i<s.length;i++){let ch=s[i];if(ch!=='x')ch=ch.toUpperCase();const g=FONT[ch];if(!g)continue;for(let j=0;j<15;j++)if(g[j]==='1')G.fillRect(Math.round(x+i*4*sc+(j%3)*sc),Math.round(y+Math.floor(j/3)*sc),sc,sc)}}
function txtS(s,x,y,c,sc=1,al,sh='#000'){txt(s,x+sc*0,y+sc,sh,sc,al);txt(s,x,y,c,sc,al)}

/* ===================== AUDIO ===================== */
let AC=null,master=null,musicGain=null,musicTimer=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=.16;musicGain.connect(master);
  const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){AC=null}}
function tone(f,d,type='square',v=.2,slide=0,delay=0,dest){if(!AC||!S.sfx&&!dest)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.3,fq=1200,delay=0,type='lowpass'){if(!AC||!S.sfx)return;const t=AC.currentTime+delay;const n=Math.floor(AC.sampleRate*d);const b=AC.createBuffer(1,n,AC.sampleRate);const da=b.getChannelData(0);for(let i=0;i<n;i++)da[i]=(rnd()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const SFX={
  card(){noise(.06,.25,3000,0,'highpass')},
  tap(){tone(660,.05,'square',.08)},
  coin(){tone(988,.08,'square',.1);tone(1319,.15,'square',.1,0,.07)},
  liar(){tone(110,.35,'sawtooth',.3,-40);noise(.2,.35,600)},
  spin(){for(let i=0;i<8;i++)tone(1400-i*60,.03,'square',.05,0,i*.07)},
  click(){tone(1800,.04,'square',.18);noise(.04,.3,4000,0,'highpass')},
  bang(){noise(.7,.9,900);tone(70,.5,'sine',.8,-40)},
  gulp(){for(let i=0;i<3;i++)tone(220,.12,'sine',.25,-120,i*.18)},
  sting(){tone(196,.4,'sawtooth',.18,-60);tone(147,.6,'sawtooth',.14,-40,.2)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.1,0,i*.11))},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.18,0,i*.16))},
  step(){tone(90,.03,'triangle',.06)},
  ach(){[784,988,1175,1568].forEach((f,i)=>tone(f,.12,'square',.09,0,i*.08))}
};
// lounge loop: walking bass + soft chord stabs
const SONG={bpm:92,chords:[[146.8,174.6,220,261.6],[130.8,155.6,196,233.1],[110,138.6,164.8,196],[123.5,146.8,174.6,220]],bass:[[73.4,82.4,87.3,98],[65.4,73.4,77.8,87.3],[55,61.7,65.4,69.3],[61.7,65.4,73.4,82.4]]};
let songStep=0,songNext=0;
function musicTick(){if(!AC||!S.music)return;const beat=60/SONG.bpm;if(songNext<AC.currentTime)songNext=AC.currentTime+.05;while(songNext<AC.currentTime+.3){const bar=Math.floor(songStep/4)%4,b=songStep%4;const t=songNext-AC.currentTime;
  tone(SONG.bass[bar][b],beat*.9,'triangle',.5,0,Math.max(0,t),musicGain);
  if(b===1||b===3)SONG.chords[bar].forEach(f=>tone(f*2,beat*.45,'sine',.07,0,Math.max(0,t+beat*.12),musicGain));
  if(b%2===1){/* brush */}
  songStep++;songNext+=beat}}
function musicStart(){if(!AC)return;songNext=AC.currentTime+.1;if(!musicTimer)musicTimer=setInterval(musicTick,100)}

/* ===================== SAVE ===================== */

let S={chips:150,peeks:2,upg:{eyes:0,face:0,luck:0,pockets:0},chars:['raccoon'],char:'raccoon',ach:{},stats:{matches:0,wins:0,streak:0,catches:0,caught:0,pulls:0,crawlBest:0},music:true,sfx:true,seenHelp:false};

  const show=lying?rnd()<pt:rnd()<pf;p.tellFlag=show;if(show){p.tellUntil=now()+2600*SPEED;if(eyes>=1)setTimeout(()=>{if(M&&!M.over)ticker((p.sp.tellTxt||'A tell!')+'...')},350*SPEED)}}

async function runMatch(){
  await sleep(500);
  while(!M.over){
    M.round++;
    if(M.mode==='deck')await deckRound();else if(M.mode==='poker')await pokerRound();else await diceRound();
    if(M.over)break;
    if(!M.players[0].alive){M.over=true;break}
    if(alive().length<=1){M.over=true;break}
    await sleep(700);
  }
  await sleep(900);
  endMatch();
}

function aiDice(p){const ai=p.sp.ai;
  if(M.bid){let pt=bidProb(p,M.bid.q,M.bid.f);const by=M.bid.by;if(by.tellFlag)pt-=.2*ai.iq;if(by.isYou)pt+=.04*S.upg.face;pt+=(rnd()-.5)*.3*(1-ai.iq);
    let thr=.42-(ai.thr-.55);if(pt<thr)return {type:'call'}}
  // choose raise
  let best=null;
  for(let f=2;f<=6;f++){let q=M.bid?(f>M.bid.f?M.bid.q:M.bid.q+1):1;
    // allow going a bit higher
    for(let qq=q;qq<=q+2;qq++){let pr=bidProb(p,qq,f);let score=pr+(qq-q)*.02*(1-ai.iq)+rnd()*.12;if(!best||score>best.s)best={q:qq,f,s:score,pr}}}
  if(rnd()<ai.lie*.5){// bluff: pick a face we lack at minimal quantity
    const f=ri(2,6);const q=M.bid?(f>M.bid.f?M.bid.q:M.bid.q+1):ri(1,3);best={q,f,pr:bidProb(p,q,f)}}
  if(M.bid&&best.pr<.3)return {type:'call'};
  if(!M.bid&&best.q<2&&rnd()<.7)best.q=Math.max(best.q,Math.round(alive().length*5/4));
  return {type:'bid',q:best.q,f:best.f}
}
async function resolveDiceCall(caller){

  ticker((caller.isYou?'You call ':caller.sp.name+' calls ')+(target.isYou?'YOU':target.sp.name)+' a liar!');renderActions('wait');

  ticker('There are '+count+' '+b.f+'s (with wilds). '+(lied?(target.isYou?'You were':target.sp.name+' was')+' lying!':(caller.isYou?'Your':caller.sp.name+"'s")+' call was wrong!'));

}

  const base={1:120,2:50,3:20,4:5}[place]||5;let mult=M.crawl?(1+.5*M.crawl.stage):1;

    if(M.mode==='deck'){ach('deck');if(me.lies===0)ach('clean')}else if(M.mode==='poker')ach('poker');else ach('dice');
    if(!M.youCaught)ach('silver');if(S.stats.streak>=3)ach('streak');if(M.players.some(p=>p.key==='octo'))ach('ink');
  }else{S.stats.streak=0;SFX.lose()}
  save();
  const crawl=M.crawl;
  let title=won?'LAST ONE STANDING':(me.alive?'SURVIVED':'YOU\'RE OUT'),sub=won?'The table is yours.':'Placed #'+place+' of 4';
  let btns=[];

      else{S.stats.crawlBest=Math.max(S.stats.crawlBest,crawl.stage);save();sub='Table '+crawl.stage+' of 5 cleared';btns=[['Next Table',()=>crawlNext(crawl),'red'],['Cash Out',()=>toHub(),'dark']]}}
    else{sub='The crawl ends at table '+(crawl.stage+1)+' of 5';btns=[['Back to the Den',()=>toHub(),'']]}
  }else btns=[['Rematch',()=>{closePanel();startMatch(M.mode,{variant:M.variant})},'red'],['Back to the Den',()=>toHub(),'']];

}
